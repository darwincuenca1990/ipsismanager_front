
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aplicación Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evitar caché del HTML principal
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Compresión
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
